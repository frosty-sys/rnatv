name: Build Release APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build GitHub & F-Droid Release APKs
        run: gradle assembleGithubRelease assembleFdroidRelease --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rnatv-release-apks
          path: app/build/outputs/apk/*/*/*.apk
