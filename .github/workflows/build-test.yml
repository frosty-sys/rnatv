name: Build & Release Signed APKs

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build GitHub & F-Droid Release APKs
        run: gradle assembleGithubRelease assembleFdroidRelease --stacktrace

      - name: Align & Sign Both APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Missing KEYSTORE_BASE64, STORE_PASSWORD, or KEY_PASSWORD in GitHub Secrets!"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"
          else
            TAG_NAME="v3.7.8"
          fi
          mkdir -p release-apks

          GITHUB_RAW=$(ls app/build/outputs/apk/github/release/*.apk | head -n 1)
          FDROID_RAW=$(ls app/build/outputs/apk/fdroid/release/*.apk | head -n 1)

          "$BUILD_TOOLS/zipalign" -p -f 4 "$GITHUB_RAW" aligned-github.apk
          "$BUILD_TOOLS/zipalign" -p -f 4 "$FDROID_RAW" aligned-fdroid.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "release-apks/RNA_${TAG_NAME}-github.apk" \
            aligned-github.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks my-upload-key.jks \
            --ks-key-alias upload \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "release-apks/RNA_${TAG_NAME}-fdroid.apk" \
            aligned-fdroid.apk

          "$BUILD_TOOLS/apksigner" verify --print-certs "release-apks/RNA_${TAG_NAME}-github.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "release-apks/RNA_${TAG_NAME}-fdroid.apk"

      - name: Upload Signed GitHub APK
        uses: actions/upload-artifact@v4
        with:
          name: RNA_v3.7.8-github
          path: release-apks/*-github.apk

      - name: Upload Signed F-Droid APK
        uses: actions/upload-artifact@v4
        with:
          name: RNA_v3.7.8-fdroid
          path: release-apks/*-fdroid.apk

      - name: Attach Both Signed APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apks/*.apk
